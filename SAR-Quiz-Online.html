<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAR-Quiz · OSC-kursus</title>
<style>
:root{--bg:#0b2540;--bg2:#12365c;--card:#173f6b;--ink:#f2f7fc;--mut:#9fb8d3;--acc:#ffb81c;--ok:#2fb86b;--bad:#e5484d;--a:#e5484d;--b:#3b82f6;--c:#f5a623;--d:#2fb86b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.4rem;margin:.2em 0}
.sub{color:var(--mut)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:12px 18px;background:var(--bg2);cursor:pointer}
button:hover{filter:brightness(1.15)}
button.pri{background:var(--acc);color:#1a1200;font-weight:700}
button[disabled]{opacity:.45;cursor:default}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid #2d5a8c;background:#0e2d4d;color:var(--ink);width:100%}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9rem}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.big{font-size:4rem;font-weight:800;letter-spacing:.15em;color:var(--acc);text-align:center;margin:.1em 0}
.q{font-size:1.5rem;font-weight:700;margin:.4em 0 .8em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.opts{grid-template-columns:1fr}.big{font-size:2.6rem}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:14px;font-size:1.1rem;border:3px solid transparent}
.opt b{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;flex:none;color:#fff}
.opt[data-i="0"] b{background:var(--a)}.opt[data-i="1"] b{background:var(--b)}.opt[data-i="2"] b{background:var(--c);color:#222}.opt[data-i="3"] b{background:var(--d)}
.opt.sel{border-color:var(--acc);background:#244f82}
.opt.right{background:#1f7a49;border-color:var(--ok)}.opt.wrong{opacity:.55}.opt.mine-wrong{background:#7a2326;border-color:var(--bad);opacity:1}
.bar{height:12px;background:#0e2d4d;border-radius:8px;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--acc);width:100%;transition:width .25s linear}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mut);font-size:.85rem;margin-right:6px}
.tag.fun{background:#6b3fa0;color:#fff}
table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #2d5a8c;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sb{position:relative;height:34px;background:#0e2d4d;border-radius:8px;margin:6px 0;overflow:hidden}
.sb>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2a6fb5,#4aa3e8);transition:width .6s}
.sb>span{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-weight:600}
.ref{background:#0e2d4d;border-left:5px solid var(--acc);padding:10px 14px;border-radius:8px;margin-top:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#0e2d4d;margin:3px;font-size:.95rem}
.pill.off{opacity:.45}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.warn{background:#3a2d0a;border:1px solid #8a6d1c;border-radius:10px;padding:10px 14px;color:#ffe29a;font-size:.92rem}
.center{text-align:center}.hide{display:none!important}
.lt{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.tm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0}.tm .opt{padding:8px 12px;font-size:.95rem;flex:none}
</style>
</head>

/* ---------- Spørgsmålsvalg ---------- */
function pickQuestions(dag,n,funPct){
  let pool=QS.filter(q=>dag==="0"||String(q.dag)===dag);
  const fun=shuffle(pool.filter(q=>q.kat==="FJOL")),sar=pool.filter(q=>q.kat!=="FJOL");
  const nf=Math.min(fun.length,Math.round(n*funPct/100)),ns=Math.min(sar.length,n-nf);
  // balance mellem SAR-kategorier: round robin
  const by={};shuffle(sar).forEach(q=>(by[q.kat]=by[q.kat]||[]).push(q));
  const keys=shuffle(Object.keys(by));const out=[];
  while(out.length<ns){let any=false;for(const k of keys){if(by[k].length&&out.length<ns){out.push(by[k].pop());any=true}}if(!any)break}
  const sel=shuffle(out);const f=fun.slice(0,nf);
  // drys fjollede jævnt ind
  const res=[];const step=f.length?Math.floor(sel.length/(f.length+1)):0;let fi=0;
  sel.forEach((q,i)=>{res.push(q);if(f.length&&fi<f.length&&(i+1)%Math.max(step,1)===0){res.push(f[fi++])}});
  while(fi<f.length)res.push(f[fi++]);
  return res.map(q=>{const opts=shuffle([q.r,...q.w]);return {id:q.id,t:q.t,tt:q.tt,kat:q.kat,dag:q.dag,q:q.q,opts,c:opts.indexOf(q.r),ref:q.ref}});
}

/* ---------- Spilmotor (kører hos spilleder) ---------- */
class Game{
  qt(){const q=this.list[this.idx];return this.cfg.time>0?this.cfg.time:(q&&q.t)||30}
  constructor(cfg,send,ui){this.cfg=cfg;this.send=send;this.ui=ui;this.teams=new Map();this.list=[];this.idx=-1;this.phase="lobby";this.deadline=0;this.timer=null;this.misses=[]}
  addTeam(name,players){let t=this.teams.get(name);if(!t){t={name,players,score:0,jokerUsed:false,ans:null,joker:false,at:0,conn:true,hist:[]};this.teams.set(name,t)}else{t.players=players;t.conn=true}return t}
  start(){this.list=pickQuestions(this.cfg.dag,this.cfg.n,this.cfg.fun);this.idx=-1;this.next()}
  next(){clearInterval(this.timer);this.idx++;if(this.idx>=this.list.length){this.phase="end";this.broadcastEnd();this.ui();return}
    this.phase="q";this.list[this.idx].time=this.qt();this.deadline=Date.now()+this.qt()*1000;this.teams.forEach(t=>{t.ans=null;t.joker=false;t.at=0});
    this.broadcastQ();this.ui();this.timer=setInterval(()=>{if(Date.now()>=this.deadline)this.lock();else this.ui(true)},250)}
  qpub(){const q=this.list[this.idx];return {t:"q",i:this.idx,n:this.list.length,kat:q.kat,q:q.q,opts:q.opts,time:this.qt(),tt:q.tt}}
  broadcastQ(){this.teams.forEach(t=>this.send(t.name,{...this.qpub(),jokerUsed:t.jokerUsed,left:Math.max(0,this.deadline-Date.now())}))}
  answer(name,i,choice){const t=this.teams.get(name);if(!t||this.phase!=="q"||i!==this.idx)return;if(t.ans===null)t.at=Date.now();t.ans=choice;
    this.send(name,{t:"ack",i,choice});
    if([...this.teams.values()].every(x=>!x.conn||x.ans!==null))this.lock();else this.ui()}
  joker(name,i,on){const t=this.teams.get(name);if(!t||this.phase!=="q"||i!==this.idx||t.jokerUsed)return;t.joker=!!on;this.send(name,{t:"jok",on:t.joker});this.ui()}
  lock(){if(this.phase!=="q")return;clearInterval(this.timer);this.phase="reveal";const q=this.list[this.idx];let right=0;
    this.teams.forEach(t=>{let gain=0,ok=false;if(t.ans===q.c){ok=true;right++;const rem=Math.max(0,this.deadline-t.at)/1000;gain=BASE+Math.round(BONUS*Math.min(1,rem/this.qt()));if(t.joker){gain*=2}}
      if(t.joker)t.jokerUsed=true;t.last={ok,gain,ans:t.ans,joker:t.joker};t.score+=gain;t.hist.push(ok)});
    if(right<this.teams.size/2&&q.kat!=="FJOL")this.misses.push({q,right,n:this.teams.size});
    const rank=this.ranking();this.teams.forEach(t=>this.send(t.name,{t:"rev",i:this.idx,c:q.c,ref:q.ref,last:t.last,score:t.score,rank:rank.findIndex(x=>x.name===t.name)+1,of:rank.length,more:this.idx<this.list.length-1}));
    this.ui()}
  ranking(){return [...this.teams.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))}
  broadcastEnd(){const r=this.ranking();this.teams.forEach(t=>this.send(t.name,{t:"end",score:t.score,rank:r.findIndex(x=>x.name===t.name)+1,top:r.map(x=>({n:x.name,s:x.score}))}))}
  stateFor(name){const t=this.teams.get(name);if(!t)return null;
    if(this.phase==="lobby")return {t:"lobby"};
    if(this.phase==="q")return {...this.qpub(),jokerUsed:t.jokerUsed,left:Math.max(0,this.deadline-Date.now()),my:t.ans,jok:t.joker};
    if(this.phase==="reveal"){const q=this.list[this.idx],r=this.ranking();return {t:"rev",i:this.idx,c:q.c,ref:q.ref,last:t.last,score:t.score,rank:r.findIndex(x=>x.name===name)+1,of:r.length,more:this.idx<this.list.length-1,opts:q.opts,q:q.q,kat:q.kat}}
    if(this.phase==="end"){const r=this.ranking();return {t:"end",score:t.score,rank:r.findIndex(x=>x.name===name)+1,top:r.map(x=>({n:x.name,s:x.score}))}}}
}

/* ---------- Visning fælles ---------- */
const head=(s)=>`<h1>⚓ SAR-Quiz</h1><div class="sub">${s||"OSC-kursus · svar findes i SAR Danmark bind II"}</div>`;
function scoreBars(game,hl){const r=game.ranking();const mx=Math.max(1,...r.map(x=>x.score));
  return r.map((t,i)=>`<div class="sb"><i style="width:${Math.max(3,t.score/mx*100)}%"></i><span><span>${i+1}. ${esc(t.name)}${t.conn?"":" (offline)"} <small class="sub">· ${t.players} pers.</small></span><span>${t.score}${game.phase==="reveal"&&t.last&&t.last.gain?` <small class="ok">+${t.last.gain}${t.last.joker?" ×2":""}</small>`:""}</span></span></div>`).join("")}
function optsHtml(q,extra){return `<div class="opts">${q.opts.map((o,i)=>`<div class="opt ${extra&&extra(i)||""}" data-i="${i}" style="cursor:default"><b>${LET[i]}</b><span>${esc(o)}</span></div>`).join("")}</div>`}

/* ---------- Start ---------- */
function home(){
  app.innerHTML=`${head()}
  <div class="card"><h2>Vælg hvordan I vil spille</h2>
  <div class="row"><button class="pri" id="bh">📺 Jeg er spilleder<br><small>Storskærm/computer – holdene bruger deres mobil</small></button>
  <button id="bj">📱 Vi er et hold<br><small>Deltag med spilkode</small></button>
  <button id="bl">🖥️ Alle ved én skærm<br><small>Uden internet – hold sidder sammen</small></button></div></div>
  <div class="card sub">2–10 hold à 2–6 personer. Et spil varer ca. 45 minutter med 36 spørgsmål. Ét spørgsmål ad gangen; alle hold svarer A–D, og facit viser hvor i SAR Danmark svaret står.</div>`;
  $("#bh").onclick=hostSetup;$("#bj").onclick=joinScreen;$("#bl").onclick=()=>hostSetup(true);
}

/* ---------- Spilleder ---------- */
let G=null,peer=null,conns={};
function hostSetup(local){
  const isLocal=local===true;
  app.innerHTML=`${head(isLocal?"Alle ved én skærm":"Spilleder")}
  <div class="card"><h2>Indstillinger</h2>
  <div class="row"><div><label>Hvilket kursusforløb?</label><select id="dag"><option value="1">Efter dag 1 – organisation, position, drift, datum, søgeområde</option><option value="2">Efter dag 2 – sweep width, POD, effort allocation, søgemønstre</option><option value="0">Hele kurset (dag 1 + dag 2)</option></select></div>
  <div><label>Antal spørgsmål (ca. 1 min pr. spørgsmål)</label><select id="n"><option value="20">20 (ca. 25 min)</option><option value="30">30 (ca. 35 min)</option><option value="36" selected>36 (ca. 45 min)</option><option value="45">45 (ca. 55 min)</option></select></div>
  <div><label>Svartid</label><select id="time"><option value="0" selected>Efter spørgsmålet: hurtige 20 s, opslag 30 s, regnestykker 60–75 s (anbefalet)</option><option value="30">Ens: 30 sek. til alle</option><option value="45">Ens: 45 sek.</option><option value="60">Ens: 60 sek.</option></select></div>
  <div><label>Fjollede spørgsmål</label><select id="fun"><option value="0">Ingen</option><option value="15">Få (15 %)</option><option value="25" selected>Nogle (25 %)</option><option value="40">Mange (40 %)</option></select></div></div>
  ${isLocal?`<label>Holdnavne – et pr. linje (2–10 hold)</label><textarea id="names" rows="5" style="width:100%;padding:10px;border-radius:10px;background:#0e2d4d;color:#fff;border:2px solid #2d5a8c;font:inherit">Hold 1
Hold 2
Hold 3
Hold 4</textarea>`:""}
  <p><button class="pri" id="go">${isLocal?"Start spillet":"Åbn spilrum"}</button> <button id="back">Tilbage</button></p></div>`;
  $("#back").onclick=home;
  $("#go").onclick=()=>{const cfg={dag:$("#dag").value,n:+$("#n").value,time:+$("#time").value,fun:+$("#fun").value};
    if(isLocal){const names=($("#names").value||"").split("\n").map(s=>s.trim()).filter(Boolean).slice(0,10);if(names.length<2){alert("Skriv mindst to holdnavne");return}
      G=new Game(cfg,()=>{},(t)=>hostView(t));[...new Set(names)].forEach(n=>G.addTeam(n,"?"));G.local=true;G.start()}
    else openRoom(cfg)}
}
function openRoom(cfg){
  const code=rid();app.innerHTML=`${head("Spilleder")}<div class="card center">Åbner spilrum …</div>`;
  const p=new Peer(PREFIX+code,PEEROPTS);peer=p;
  p.on("error",e=>{if(e.type==="unavailable-id"){openRoom(cfg);return}
    app.innerHTML=`${head("Spilleder")}<div class="card"><h2 class="no">Kunne ikke åbne spilrum</h2><p>${esc(e.type||e)}</p><p>Tjek at computeren har internet. Hvis netværket blokerer forbindelsen (fx på Forsvarets/skolens net), så brug <b>Alle ved én skærm</b>, eller et andet net (mobilt hotspot).</p><button id="b">Tilbage</button></div>`;$("#b").onclick=home});
  p.on("open",()=>{
    G=new Game(cfg,(name,msg)=>{const c=conns[name];if(c&&c.open)c.send(msg)},(t)=>hostView(t));G.code=code;G.local=false;
    p.on("connection",c=>{
      c.on("data",m=>onTeamMsg(c,m));
      c.on("close",()=>{if(c._team&&conns[c._team]===c){const t=G.teams.get(c._team);if(t)t.conn=false;hostView()}});
    });
    hostView()});
  p.on("disconnected",()=>{try{p.reconnect()}catch(e){}});
}
function onTeamMsg(c,m){if(!G||!m)return;
  if(m.t==="join"){const name=String(m.name||"").trim().slice(0,20),pl=Math.min(6,Math.max(1,+m.players||1));
    if(!name){c.send({t:"reject",msg:"Skriv et holdnavn"});return}
    const ex=G.teams.get(name);
    if(!ex&&G.phase!=="lobby"){c.send({t:"reject",msg:"Spillet er allerede i gang. Brug præcis samme holdnavn som før for at komme tilbage."});return}
    if(!ex&&G.teams.size>=10){c.send({t:"reject",msg:"Der er allerede 10 hold"});return}
    if(ex&&ex.conn&&conns[name]&&conns[name].open&&conns[name]!==c){if(G.phase==="lobby"){c.send({t:"reject",msg:"Holdnavnet er optaget – vælg et andet"});return}
      try{const o=conns[name];o._team=null;o.close()}catch(e){}}
    conns[name]=c;c._team=name;G.addTeam(name,pl);c.send({t:"joined",name});
    const st=G.stateFor(name);if(st)c.send(st);hostView();return}
  if(!c._team)return;
  if(m.t==="ans")G.answer(c._team,m.i,m.choice);
  if(m.t==="joker")G.joker(c._team,m.i,m.on);
}
function qHead(q,i,n){const tt=q.tt?`<span class="tag">⏱ ${q.tt==='Regn'?'Regnestykke':q.tt==='Opslag'?'Opslag':'Hurtig'}${q.time?' · '+q.time+' s':(q.t?' · '+q.t+' s':'')}</span>`:'';return `${tt}<span class="tag">Spørgsmål ${i+1} / ${n}</span><span class="tag ${q.kat==="FJOL"?"fun":""}">${esc(KAT[q.kat])}</span>`}
function hostView(tick){
  if(!G)return;
  if(tick&&G.phase==="q"){const left=Math.max(0,G.deadline-Date.now());const b=$("#tb");if(b){b.style.width=(left/(G.qt()*1000)*100)+"%";$("#tl").textContent=Math.ceil(left/1000)+" s";return}}
  const nT=G.teams.size;
  if(G.phase==="lobby"){
    app.innerHTML=`${head("Spilleder · storskærm")}
    <div class="card center"><div class="sub">Hold: åbn denne side på mobilen, vælg “Vi er et hold” og skriv koden</div><div class="big">${G.code}</div></div>
    <div class="card"><h2>Hold klar (${nT})</h2>${nT?[...G.teams.values()].map(t=>`<span class="pill ${t.conn?"":"off"}">${esc(t.name)} · ${t.players} pers.</span>`).join(""):'<span class="sub">Ingen hold endnu …</span>'}
    <p><button class="pri" id="st" ${nT<2?"disabled":""}>Start spillet (${G.cfg.n} spørgsmål)</button></p>
    <div class="warn">Spillet kører i denne fane. Luk den ikke, før spillet er slut.</div></div>`;
    const b=$("#st");if(b)b.onclick=()=>G.start();return}
  if(G.phase==="q"){const q=G.list[G.idx];const left=Math.max(0,G.deadline-Date.now());const done=[...G.teams.values()].filter(t=>t.ans!==null).length;
    const loc=G.local;
    app.innerHTML=`<div>${qHead(q,G.idx,G.list.length)}</div>
    <div class="tm"><div class="bar" style="flex:1"><i id="tb" style="width:${left/(G.qt()*1000)*100}%"></i></div><b id="tl">${Math.ceil(left/1000)} s</b></div>
    <div class="q">${esc(q.q)}</div>${optsHtml(q)}
    ${loc?`<div class="card"><b>Svar pr. hold</b>${[...G.teams.values()].map(t=>`<div class="tm"><span style="min-width:110px">${esc(t.name)}</span>${[0,1,2,3].map(i=>`<button class="opt ${t.ans===i?"sel":""}" data-t="${esc(t.name)}" data-i="${i}"><b>${LET[i]}</b></button>`).join("")}<button class="${t.joker?"pri":""}" data-j="${esc(t.name)}" ${t.jokerUsed?"disabled":""}>×2</button></div>`).join("")}</div>`:`<p class="sub">${done} / ${nT} hold har svaret</p>`}
    <p><button id="sk">Afslut spørgsmålet nu</button></p>`;
    $("#sk").onclick=()=>G.lock();
    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>G.answer(b.dataset.t,G.idx,+b.dataset.i));
    document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const t=G.teams.get(b.dataset.j);G.joker(b.dataset.j,G.idx,!t.joker)});
    return}
  if(G.phase==="reveal"){const q=G.list[G.idx];
    app.innerHTML=`<div>${qHead(q,G.idx,G.list.length)}</div><div class="q">${esc(q.q)}</div>
    ${optsHtml(q,i=>i===q.c?"right":"wrong")}
    <div class="ref">📖 <b>Slå op:</b> ${esc(q.ref)}</div>
    <div class="card"><b>Stilling</b>${scoreBars(G)}</div>
    <p><button class="pri" id="nx">${G.idx<G.list.length-1?"Næste spørgsmål →":"Vis slutresultat"}</button></p>`;
    $("#nx").onclick=()=>G.next();return}
  if(G.phase==="end"){const r=G.ranking();const medals=["🥇","🥈","🥉"];
    app.innerHTML=`${head("Slutresultat")}
    <div class="card"><h2>Vinder: ${esc(r[0].name)} 🎉</h2>${r.map((t,i)=>`<div class="sb"><i style="width:${Math.max(3,t.score/Math.max(1,r[0].score)*100)}%"></i><span><span>${medals[i]||i+1+"."} ${esc(t.name)}</span><span>${t.score} p.</span></span></div>`).join("")}</div>
    <div class="card"><h2>Gennemgå disse – flest hold svarede forkert</h2>${G.misses.length?G.misses.map(m=>`<p><b>${esc(m.q.q)}</b><br><span class="ok">Rigtigt: ${esc(m.q.opts[m.q.c])}</span><br><span class="sub">📖 ${esc(m.q.ref)} · ${m.right}/${m.n} hold rigtige</span></p>`).join(""):'<span class="sub">Alle holdene klarede de fleste spørgsmål – flot!</span>'}</div>
    <p><button id="ag">Nyt spil</button></p>`;
    $("#ag").onclick=()=>{try{peer&&peer.destroy()}catch(e){};G=null;conns={};home()};}
}

/* ---------- Hold ---------- */
let conn=null,S=null,ctimer=null;
function joinScreen(msg){
  const saved=(()=>{try{return JSON.parse(sessionStorage.getItem("sarq")||"{}")}catch(e){return{}}})();
  app.innerHTML=`${head("Deltag som hold")}
  <div class="card">${typeof msg==="string"?`<p class="no">${esc(msg)}</p>`:""}
  <label>Spilkode (4 tegn – står på storskærmen)</label><input id="code" maxlength="4" autocapitalize="characters" value="${esc(saved.code||"")}" style="text-transform:uppercase;font-size:1.6rem;letter-spacing:.2em">
  <label>Holdnavn</label><input id="name" maxlength="20" value="${esc(saved.name||"")}">
  <label>Antal på holdet (1–6)</label><select id="pl">${[1,2,3,4,5,6].map(n=>`<option ${n==(saved.pl||4)?"selected":""}>${n}</option>`).join("")}</select>
  <p><button class="pri" id="jn">Deltag</button> <button id="back">Tilbage</button></p>
  <div class="sub">Kun én telefon pr. hold svarer – tal sammen og vælg ét svar. Mister I forbindelsen, så brug samme kode og samme holdnavn igen.</div></div>`;
  $("#back").onclick=home;
  $("#jn").onclick=()=>{const code=$("#code").value.trim().toUpperCase(),name=$("#name").value.trim(),pl=+$("#pl").value;if(code.length!==4||!name){joinScreen("Skriv både kode og holdnavn");return}
    try{sessionStorage.setItem("sarq",JSON.stringify({code,name,pl}))}catch(e){}
    joinNow(code,name,pl)};
}
function joinNow(code,name,pl){
  app.innerHTML=`${head("Deltag som hold")}<div class="card center">Forbinder …</div>`;
  const p=new Peer(PEEROPTS);peer=p;let opened=false;
  const fail=m=>{try{p.destroy()}catch(e){}joinScreen(m)};
  const to=setTimeout(()=>{if(!opened)fail("Ingen forbindelse. Tjek koden og internettet – eller prøv et andet net.")},15000);
  p.on("error",e=>{clearTimeout(to);fail(e.type==="peer-unavailable"?"Fandt ikke noget spil med den kode":"Fejl: "+(e.type||e))});
  p.on("open",()=>{conn=p.connect(PREFIX+code,{reliable:true});
    conn.on("open",()=>{opened=true;clearTimeout(to);conn.send({t:"join",name,players:pl})});
    conn.on("data",m=>onHost(m,name));
    conn.on("close",()=>{clearInterval(ctimer);app.innerHTML=`${head("Deltag som hold")}<div class="card"><h2 class="no">Forbindelsen til spillederen blev afbrudt</h2><p>Tryk Deltag igen med samme kode og holdnavn for at komme tilbage ind.</p><button class="pri" id="rj">Deltag igen</button></div>`;$("#rj").onclick=()=>joinNow(code,name,pl)})});
}
function onHost(m,name){
  if(m.t==="reject"){try{peer.destroy()}catch(e){}joinScreen(m.msg);return}
  if(m.t==="joined"||m.t==="lobby"){clearInterval(ctimer);app.innerHTML=`${head("Hold: "+esc(name))}<div class="card center"><h2>Du er med! ✅</h2><p>Vent på at spillederen starter spillet …</p></div>`;return}
  if(m.t==="q"){S={...m,name,my:m.my===undefined?null:m.my,jok:!!m.jok,t0:Date.now(),left:m.left===undefined?m.time*1000:m.left};drawQ();return}
  if(m.t==="ack"&&S&&m.i===S.i){S.my=m.choice;drawQ(true);return}
  if(m.t==="jok"&&S){S.jok=m.on;drawQ(true);return}
  if(m.t==="rev"){clearInterval(ctimer);const q=m.q?m:S;const opts=m.opts||S.opts;const r=m.last||{};
    app.innerHTML=`<div class="center"><h1 class="${r.ok?"ok":"no"}">${r.ok?"Rigtigt! ✅":(r.ans===null||r.ans===undefined?"Ikke svaret ⏰":"Forkert ❌")}</h1>${r.ok?`<h2>+${r.gain} point${r.joker?" (×2)":""}</h2>`:""}</div>
    <div class="q">${esc((m.q||S.q))}</div>
    ${optsHtml({opts},i=>i===m.c?"right":(i===r.ans?"mine-wrong":"wrong"))}
    <div class="ref">📖 <b>Slå op:</b> ${esc(m.ref)}</div>
    <div class="card center"><b>Jeres stilling: ${m.rank}. plads af ${m.of} · ${m.score} point</b><div class="sub">${m.more?"Vent på næste spørgsmål …":"Vent på slutresultatet …"}</div></div>`;return}
  if(m.t==="end"){clearInterval(ctimer);app.innerHTML=`${head("Slutresultat")}<div class="card center"><h2>${m.rank===1?"I vandt! 🏆":"I blev nr. "+m.rank}</h2><h2>${m.score} point</h2></div>
    <div class="card">${m.top.map((t,i)=>`<div class="sb"><i style="width:${Math.max(3,t.s/Math.max(1,m.top[0].s)*100)}%"></i><span><span>${i+1}. ${esc(t.n)}</span><span>${t.s}</span></span></div>`).join("")}</div>`;return}
}
function drawQ(keep){
  const q=S;const left=()=>Math.max(0,q.left-(Date.now()-q.t0));
  app.innerHTML=`<div>${qHead(q,q.i,q.n)}</div>
  <div class="tm"><div class="bar" style="flex:1"><i id="tb" style="width:${left()/(q.time*1000)*100}%"></i></div><b id="tl">${Math.ceil(left()/1000)} s</b></div>
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${q.my===i?"sel":""}" data-i="${i}"><b>${LET[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
  <div class="card center">${q.my===null?"Vælg jeres svar":"Svar sendt: <b>"+LET[q.my]+"</b> – I kan skifte indtil tiden er gået"}
  <p><button id="jk" class="${q.jok?"pri":""}" ${q.jokerUsed?"disabled":""}>${q.jokerUsed?"Joker brugt":(q.jok?"Dobbelt op: TIL":"Brug jeres ‘Dobbelt op’-joker (×2 point)")}</button></p></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>conn.send({t:"ans",i:q.i,choice:+b.dataset.i}));
  const jk=$("#jk");if(jk&&!q.jokerUsed)jk.onclick=()=>conn.send({t:"joker",i:q.i,on:!q.jok});
  clearInterval(ctimer);ctimer=setInterval(()=>{const b=$("#tb");if(!b){clearInterval(ctimer);return}b.style.width=(left()/(q.time*1000)*100)+"%";$("#tl").textContent=Math.ceil(left()/1000)+" s"},250);
}
home();
</script>
